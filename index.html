<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KumonBaixa">
  <meta name="theme-color" content="#003087">
  <title>KumonBaixa</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --kb-blue:#003087;
      --kb-blue-mid:#1a4db3;
      --kb-blue-light:#e8eef8;
      --kb-yellow:#FFD100;
      --kb-yellow-dark:#b89200;
      --kb-white:#ffffff;
      --kb-text:#1a1a2e;
      --kb-muted:#5a6a8a;
      --kb-border:#d0d9ec;
      --kb-surface:#f5f7fc;
      --kb-radius:12px;
      --kb-radius-sm:8px;
    }
    html,body{height:100%;overflow:hidden;background:#e8eef8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    .app{
      max-width:430px;
      width:100%;
      height:100%;
      max-height:100vh;
      margin:0 auto;
      background:#fff;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      position:relative;
    }
    @media(min-width:430px){
      body{display:flex;align-items:center;justify-content:center}
      .app{height:90vh;max-height:780px;border-radius:24px;box-shadow:0 8px 40px rgba(0,48,135,0.18)}
    }

    .screen{display:none;flex-direction:column;flex:1;overflow:hidden}
    .screen.active{display:flex}

    /* TOPBAR */
    .topbar{background:var(--kb-blue);padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
    .topbar-title{font-size:15px;font-weight:600;color:#fff;flex:1}
    .topbar-sub{font-size:11px;color:rgba(255,255,255,0.7)}
    .back-btn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.9);font-size:22px;padding:0 6px 0 0;line-height:1}
    .logout-btn{background:rgba(255,255,255,0.15);border:0.5px solid rgba(255,255,255,0.3);border-radius:8px;color:#fff;font-size:12px;padding:5px 10px;cursor:pointer}

    /* BOTTOM NAV */
    .bottomnav{border-top:0.5px solid var(--kb-border);display:flex;background:#fff;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
    .nav-btn{flex:1;padding:10px 4px 6px;background:none;border:none;cursor:pointer;font-size:11px;color:var(--kb-muted);display:flex;flex-direction:column;align-items:center;gap:3px}
    .nav-btn.active{color:var(--kb-blue)}
    .nav-icon{font-size:20px;line-height:1}
    .nav-bar{height:2px;background:var(--kb-blue);border-radius:1px;width:20px;margin-top:2px;opacity:0}
    .nav-btn.active .nav-bar{opacity:1}

    /* CONTENT */
    .content{flex:1;overflow-y:auto;padding:16px;background:var(--kb-surface);-webkit-overflow-scrolling:touch}

    /* BADGES */
    .badge-status{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600}
    .st-ativo{background:#e8eef8;color:#003087}
    .st-cancelamento{background:#fff3cd;color:#7a5800}
    .st-cancelado{background:#e8f0e8;color:#2d5a2d}
    .st-alerta{background:#fde8e8;color:#8b1a1a}

    /* CARDS */
    .card{background:#fff;border:0.5px solid var(--kb-border);border-radius:var(--kb-radius);padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s;active:opacity:.85}
    .card:active{opacity:.85}
    .card-alerta{border-left:3px solid #e24b4b}
    .card-name{font-size:14px;font-weight:600;color:var(--kb-text);margin-bottom:2px}
    .card-sub{font-size:12px;color:var(--kb-muted);margin-bottom:8px}
    .card-row{display:flex;justify-content:space-between;align-items:center}

    /* METRICS */
    .metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
    .metric{background:#fff;border:0.5px solid var(--kb-border);border-radius:var(--kb-radius);padding:12px 14px}
    .metric-label{font-size:11px;color:var(--kb-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
    .metric-value{font-size:24px;font-weight:600;color:var(--kb-text)}
    .metric-value.alerta{color:#8b1a1a}
    .metric-accent{border-top:3px solid var(--kb-blue)}
    .metric-warn{border-top:3px solid var(--kb-yellow)}

    /* FORM */
    .field{margin-bottom:14px}
    .field label{display:block;font-size:12px;color:var(--kb-muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
    .field input,.field select,.field textarea{
      width:100%;padding:10px 12px;font-size:14px;
      border:0.5px solid var(--kb-border);border-radius:var(--kb-radius-sm);
      background:#fff;color:var(--kb-text);
      -webkit-appearance:none;appearance:none;
    }
    .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--kb-blue);outline-offset:-1px;border-color:transparent}
    .field textarea{resize:vertical;min-height:72px}

    /* BUTTONS */
    .btn-primary{
      width:100%;padding:13px;
      background:var(--kb-blue);color:#fff;
      border:none;border-radius:var(--kb-radius-sm);
      font-size:15px;font-weight:600;cursor:pointer;
      margin-top:8px;letter-spacing:.02em;
    }
    .btn-primary:active{background:var(--kb-blue-mid)}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed}

    /* CHIPS */
    .disc-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
    .disc-chip{padding:7px 14px;border-radius:999px;font-size:13px;border:0.5px solid var(--kb-border);cursor:pointer;color:var(--kb-muted);background:#fff;transition:all .15s;user-select:none}
    .disc-chip.selected{background:var(--kb-blue);color:#fff;border-color:var(--kb-blue)}
    .disc-chip:active{opacity:.8}

    .filter-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
    .filter-chip{padding:5px 12px;border-radius:999px;font-size:12px;border:0.5px solid var(--kb-border);cursor:pointer;color:var(--kb-muted);background:#fff;user-select:none}
    .filter-chip.active{background:var(--kb-blue);color:#fff;border-color:var(--kb-blue)}
    .filter-chip:active{opacity:.8}

    /* STATUS OPTIONS */
    .status-select-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
    .status-opt{padding:7px 14px;border-radius:999px;font-size:13px;border:0.5px solid var(--kb-border);cursor:pointer;color:var(--kb-muted);background:#fff;user-select:none}
    .status-opt.selected{background:var(--kb-blue);color:#fff;border-color:var(--kb-blue)}

    /* DETAIL */
    .detail-card{background:#fff;border:0.5px solid var(--kb-border);border-radius:var(--kb-radius);padding:14px;margin-bottom:12px}
    .detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:0.5px solid var(--kb-border);font-size:13px}
    .detail-row:last-child{border-bottom:none}
    .detail-label{color:var(--kb-muted);flex-shrink:0;margin-right:12px}
    .detail-val{color:var(--kb-text);font-weight:600;text-align:right}

    /* ALERTS */
    .alert-banner{background:#fff3cd;border:0.5px solid #ffe066;border-left:3px solid var(--kb-yellow-dark);border-radius:var(--kb-radius-sm);padding:10px 14px;margin-bottom:14px;font-size:13px;color:#7a5800;line-height:1.5}

    /* MISC */
    .empty{text-align:center;padding:48px 16px;color:var(--kb-muted);font-size:14px;line-height:1.6}
    .loading{text-align:center;padding:48px;color:var(--kb-muted);font-size:14px}
    .section-title{font-size:11px;font-weight:700;color:var(--kb-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
    .msg-err{font-size:12px;color:#8b1a1a;margin-top:6px;text-align:center;min-height:18px}
    .msg-ok{font-size:12px;color:#2d5a2d;margin-top:6px;text-align:center;min-height:18px}

    /* LOGIN */
    .login-screen-inner{display:flex;flex-direction:column;flex:1;overflow-y:auto}
    .login-header{background:var(--kb-blue);padding:40px 24px 32px;text-align:center;flex-shrink:0}
    .login-logo{width:70px;height:70px;background:var(--kb-yellow);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:30px;font-weight:800;color:var(--kb-blue)}
    .login-title{font-size:24px;font-weight:700;color:#fff;margin-bottom:4px}
    .login-sub{font-size:13px;color:rgba(255,255,255,0.7)}
    .login-body{padding:24px;background:#fff;flex:1}
    .unit-select-wrap{position:relative}
    .unit-select-wrap select{width:100%;padding:10px 36px 10px 12px;font-size:14px;font-weight:600;border:0.5px solid var(--kb-border);border-radius:var(--kb-radius-sm);background:#fff;color:var(--kb-blue);-webkit-appearance:none;appearance:none;cursor:pointer}
    .unit-select-wrap select:focus{outline:2px solid var(--kb-blue);outline-offset:-1px;border-color:transparent}
    .unit-select-arrow{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--kb-blue);font-size:12px}
  </style>
</head>
<body>
<div class="app">

  <!-- LOGIN -->
  <div class="screen active" id="screen-login">
    <div class="login-screen-inner">
      <div class="login-header">
        <div class="login-logo">K</div>
        <div class="login-title">KumonBaixa</div>
        <div class="login-sub">Controle de cancelamentos</div>
      </div>
      <div class="login-body">
        <div class="field">
          <label>Unidade</label>
          <div class="unit-select-wrap">
            <select id="sel-unidade" onchange="selUnit(this.value)">
              <option value="Centro">Centro</option>
              <option value="Bosque">Bosque</option>
            </select>
            <span class="unit-select-arrow">&#9660;</span>
          </div>
        </div>
        <div class="field"><label>Seu nome</label><input type="text" id="login-user" placeholder="Nome do funcionário" autocomplete="name"></div>
        <div class="field"><label>Senha</label><input type="password" id="login-pass" placeholder="Senha da unidade" autocomplete="current-password"></div>
        <div class="msg-err" id="login-msg"></div>
        <button class="btn-primary" id="btn-login" onclick="doLogin()">Entrar</button>
      </div>
    </div>
  </div>

  <!-- HOME -->
  <div class="screen" id="screen-home">
    <div class="topbar">
      <div style="flex:1">
        <div class="topbar-title" id="home-title">KumonBaixa</div>
        <div class="topbar-sub" id="home-sub"></div>
      </div>
      <button class="logout-btn" onclick="doLogout()">Sair</button>
    </div>
    <div class="content" id="home-content"><div class="loading">Carregando...</div></div>
    <div class="bottomnav">
      <button class="nav-btn active" id="nav-home" onclick="navTo('home')">
        <span class="nav-icon">&#9776;</span><span>Contratos</span><div class="nav-bar"></div>
      </button>
      <button class="nav-btn" id="nav-novo" onclick="navTo('novo')">
        <span class="nav-icon">&#43;</span><span>Novo</span><div class="nav-bar"></div>
      </button>
      <button class="nav-btn" id="nav-alertas" onclick="navTo('alertas')">
        <span class="nav-icon">&#9888;</span><span>Alertas</span><div class="nav-bar"></div>
      </button>
    </div>
  </div>

  <!-- NOVO -->
  <div class="screen" id="screen-novo">
    <div class="topbar">
      <button class="back-btn" onclick="navTo('home')">&#8592;</button>
      <div class="topbar-title">Novo cancelamento</div>
    </div>
    <div class="content">
      <div class="field"><label>Nome do responsável</label><input type="text" id="f-resp" placeholder="Nome completo" autocomplete="off"></div>
      <div class="field"><label>Nome do aluno</label><input type="text" id="f-aluno" placeholder="Nome do aluno" autocomplete="off"></div>
      <div class="field"><label>Data de contratação</label><input type="date" id="f-contrat"></div>
      <div class="field"><label>Data da solicitação</label><input type="date" id="f-solic"></div>
      <div class="field">
        <label>Disciplina(s)</label>
        <div class="disc-chips">
          <div class="disc-chip" onclick="toggleDisc(this,'Matemática')">Matemática</div>
          <div class="disc-chip" onclick="toggleDisc(this,'Português')">Português</div>
          <div class="disc-chip" onclick="toggleDisc(this,'Inglês')">Inglês</div>
        </div>
      </div>
      <div class="field"><label>Valor da multa (R$)</label><input type="number" id="f-multa" placeholder="0,00" step="0.01" min="0" inputmode="decimal"></div>
      <div class="field">
        <label>Status inicial</label>
        <div class="status-select-row">
          <div class="status-opt selected" onclick="selStatus(this,'Em Cancelamento')">Em cancelamento</div>
          <div class="status-opt" onclick="selStatus(this,'Ativo')">Ativo</div>
          <div class="status-opt" onclick="selStatus(this,'Cancelado')">Cancelado</div>
        </div>
      </div>
      <div class="field"><label>Observações</label><textarea id="f-obs" placeholder="Opcional"></textarea></div>
      <div class="msg-err" id="novo-msg"></div>
      <button class="btn-primary" id="btn-salvar" onclick="salvarContrato()">Registrar cancelamento</button>
    </div>
    <div class="bottomnav">
      <button class="nav-btn" onclick="navTo('home')"><span class="nav-icon">&#9776;</span><span>Contratos</span><div class="nav-bar"></div></button>
      <button class="nav-btn active"><span class="nav-icon">&#43;</span><span>Novo</span><div class="nav-bar"></div></button>
      <button class="nav-btn" onclick="navTo('alertas')"><span class="nav-icon">&#9888;</span><span>Alertas</span><div class="nav-bar"></div></button>
    </div>
  </div>

  <!-- ALERTAS -->
  <div class="screen" id="screen-alertas">
    <div class="topbar">
      <div style="flex:1">
        <div class="topbar-title">Alertas</div>
        <div class="topbar-sub">Cancelamentos +5 dias sem atualização</div>
      </div>
    </div>
    <div class="content" id="alertas-content"><div class="loading">Carregando...</div></div>
    <div class="bottomnav">
      <button class="nav-btn" onclick="navTo('home')"><span class="nav-icon">&#9776;</span><span>Contratos</span><div class="nav-bar"></div></button>
      <button class="nav-btn" onclick="navTo('novo')"><span class="nav-icon">&#43;</span><span>Novo</span><div class="nav-bar"></div></button>
      <button class="nav-btn active"><span class="nav-icon">&#9888;</span><span>Alertas</span><div class="nav-bar"></div></button>
    </div>
  </div>

  <!-- DETALHE -->
  <div class="screen" id="screen-detalhe">
    <div class="topbar">
      <button class="back-btn" onclick="navTo('home')">&#8592;</button>
      <div class="topbar-title">Detalhes do contrato</div>
    </div>
    <div class="content" id="detalhe-content"></div>
  </div>

</div>

<script>
const API='https://script.google.com/macros/s/AKfycbwFoftUZ5JBjp38GsI1j2jAfyRY94F6ivi2u2Agvk7OUAn78nRoukRUhwLqCBycRpM/exec';
let state={unidade:'Centro',usuario:'',contratos:[],filtro:'todos',statusSel:'Em Cancelamento',discsSel:[]};

async function api(params){
  const url=API+'?'+new URLSearchParams(params);
  const r=await fetch(url);
  return r.json();
}

function selUnit(u){
  state.unidade=u;
}

async function doLogin(){
  const user=document.getElementById('login-user').value.trim();
  const pass=document.getElementById('login-pass').value.trim();
  const msg=document.getElementById('login-msg');
  if(!user){msg.textContent='Informe seu nome.';return;}
  if(!pass){msg.textContent='Informe a senha.';return;}
  document.getElementById('btn-login').disabled=true;
  msg.textContent='Verificando...';
  try{
    const r=await api({action:'autenticar',unidade:state.unidade,senha:pass});
    if(r.sucesso){
      state.usuario=user;
      document.getElementById('home-title').textContent='Unidade '+state.unidade;
      document.getElementById('home-sub').textContent='Olá, '+user;
      showScreen('home');
      carregarHome();
    }else{msg.textContent='Senha incorreta.';}
  }catch(e){msg.textContent='Erro de conexão com a API.';}
  document.getElementById('btn-login').disabled=false;
}

function doLogout(){
  state.usuario='';state.contratos=[];
  document.getElementById('login-pass').value='';
  document.getElementById('login-msg').textContent='';
  showScreen('login');
}

async function carregarHome(){
  const el=document.getElementById('home-content');
  el.innerHTML='<div class="loading">Carregando contratos...</div>';
  try{
    const r=await api({action:'listar',unidade:state.unidade});
    if(r.sucesso){state.contratos=r.registros;renderHome();}
    else el.innerHTML='<div class="empty">Erro ao carregar os contratos.</div>';
  }catch(e){el.innerHTML='<div class="empty">Sem conexão com a API.<br>Verifique sua internet.</div>';}
}

function renderHome(){
  const el=document.getElementById('home-content');
  const todos=state.contratos;
  const emCanc=todos.filter(c=>c.status==='Em Cancelamento').length;
  const cancelados=todos.filter(c=>c.status==='Cancelado').length;
  const alertas=todos.filter(c=>c.alerta_5_dias==='SIM'&&c.status==='Em Cancelamento').length;
  const multas=todos.reduce((s,c)=>s+(parseFloat(c.valor_multa)||0),0);
  let filtrados=todos;
  if(state.filtro==='Ativo') filtrados=todos.filter(c=>c.status==='Ativo');
  else if(state.filtro==='Em Cancelamento') filtrados=todos.filter(c=>c.status==='Em Cancelamento');
  else if(state.filtro==='Cancelado') filtrados=todos.filter(c=>c.status==='Cancelado');

  let html=`
    <div class="metric-grid">
      <div class="metric metric-accent"><div class="metric-label">Em cancelamento</div><div class="metric-value">${emCanc}</div></div>
      <div class="metric metric-warn"><div class="metric-label">Alertas +5 dias</div><div class="metric-value alerta">${alertas}</div></div>
      <div class="metric"><div class="metric-label">Cancelados</div><div class="metric-value">${cancelados}</div></div>
      <div class="metric"><div class="metric-label">Multas (R$)</div><div class="metric-value" style="font-size:16px;margin-top:4px">${multas.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div></div>
    </div>
    <div class="section-title">Contratos (${filtrados.length})</div>
    <div class="filter-row">
      <div class="filter-chip ${state.filtro==='todos'?'active':''}" onclick="setFiltro('todos')">Todos</div>
      <div class="filter-chip ${state.filtro==='Ativo'?'active':''}" onclick="setFiltro('Ativo')">Ativos</div>
      <div class="filter-chip ${state.filtro==='Em Cancelamento'?'active':''}" onclick="setFiltro('Em Cancelamento')">Em cancelamento</div>
      <div class="filter-chip ${state.filtro==='Cancelado'?'active':''}" onclick="setFiltro('Cancelado')">Cancelados</div>
    </div>`;

  if(filtrados.length===0){
    html+='<div class="empty">Nenhum contrato encontrado.<br>Use o botão + para registrar um cancelamento.</div>';
  }else{
    filtrados.forEach(c=>{
      const alerta=c.alerta_5_dias==='SIM'&&c.status==='Em Cancelamento';
      const badgeCls=alerta?'st-alerta':(c.status==='Ativo'?'st-ativo':c.status==='Em Cancelamento'?'st-cancelamento':'st-cancelado');
      const badgeTxt=alerta?'&#9888; +5 dias':c.status;
      html+=`<div class="card ${alerta?'card-alerta':''}" onclick="verDetalhe('${c.id}')">
        <div class="card-name">${c.nome_aluno||'—'}</div>
        <div class="card-sub">${c.nome_responsavel||'—'} &middot; ${c.disciplinas||'—'}</div>
        <div class="card-row">
          <span class="badge-status ${badgeCls}">${badgeTxt}</span>
          <span style="font-size:11px;color:var(--kb-muted)">${c.data_solicitacao||''}</span>
        </div>
      </div>`;
    });
  }
  el.innerHTML=html;
}

function setFiltro(f){state.filtro=f;renderHome();}

async function carregarAlertas(){
  const el=document.getElementById('alertas-content');
  el.innerHTML='<div class="loading">Carregando alertas...</div>';
  try{
    const r=await api({action:'alertas',unidade:state.unidade});
    if(r.sucesso){
      if(r.registros.length===0){el.innerHTML='<div class="empty">Nenhum alerta no momento.<br>Todos os cancelamentos estão em dia.</div>';return;}
      let html=`<div class="alert-banner">&#9888; ${r.registros.length} contrato(s) aguardando resolução há mais de 5 dias.</div>`;
      r.registros.forEach(c=>{
        html+=`<div class="card card-alerta" onclick="verDetalhe('${c.id}')">
          <div class="card-name">${c.nome_aluno||'—'}</div>
          <div class="card-sub">${c.nome_responsavel||'—'} &middot; ${c.disciplinas||'—'}</div>
          <div class="card-row">
            <span class="badge-status st-alerta">&#9888; ${c.dias_cancelamento} dias</span>
            <span style="font-size:11px;color:var(--kb-muted)">${c.data_solicitacao||''}</span>
          </div>
        </div>`;
      });
      el.innerHTML=html;
    }
  }catch(e){el.innerHTML='<div class="empty">Sem conexão.</div>';}
}

function verDetalhe(id){
  const c=state.contratos.find(x=>x.id===id);
  if(!c)return;
  const alerta=c.alerta_5_dias==='SIM'&&c.status==='Em Cancelamento';
  let html=alerta?`<div class="alert-banner">&#9888; Contrato em cancelamento há ${c.dias_cancelamento} dias sem atualização.</div>`:'';
  html+=`
    <div class="detail-card">
      <div class="section-title" style="margin-bottom:10px">Dados do contrato</div>
      <div class="detail-row"><span class="detail-label">Aluno</span><span class="detail-val">${c.nome_aluno||'—'}</span></div>
      <div class="detail-row"><span class="detail-label">Responsável</span><span class="detail-val">${c.nome_responsavel||'—'}</span></div>
      <div class="detail-row"><span class="detail-label">Disciplina(s)</span><span class="detail-val">${c.disciplinas||'—'}</span></div>
      <div class="detail-row"><span class="detail-label">Contratação</span><span class="detail-val">${c.data_contratacao||'—'}</span></div>
      <div class="detail-row"><span class="detail-label">Solicitação</span><span class="detail-val">${c.data_solicitacao||'—'}</span></div>
      <div class="detail-row"><span class="detail-label">Multa (R$)</span><span class="detail-val">${parseFloat(c.valor_multa||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</span></div>
      <div class="detail-row"><span class="detail-label">Status</span><span class="detail-val">${c.status||'—'}</span></div>
      <div class="detail-row"><span class="detail-label">Registrado por</span><span class="detail-val">${c.registrado_por||'—'}</span></div>
      <div class="detail-row"><span class="detail-label">Observações</span><span class="detail-val">${c.observacoes||'—'}</span></div>
    </div>
    <div class="detail-card">
      <div class="section-title">Atualizar status</div>
      <div class="status-select-row" id="det-status-row">
        <div class="status-opt ${c.status==='Ativo'?'selected':''}" onclick="atualizarStatus('${c.id}',this,'Ativo')">Ativo</div>
        <div class="status-opt ${c.status==='Em Cancelamento'?'selected':''}" onclick="atualizarStatus('${c.id}',this,'Em Cancelamento')">Em cancelamento</div>
        <div class="status-opt ${c.status==='Cancelado'?'selected':''}" onclick="atualizarStatus('${c.id}',this,'Cancelado')">Cancelado</div>
      </div>
      <div id="det-msg" style="font-size:12px;color:#2d5a2d;margin-top:8px;text-align:center;min-height:18px"></div>
    </div>`;
  document.getElementById('detalhe-content').innerHTML=html;
  showScreen('detalhe');
}

async function atualizarStatus(id,el,novoStatus){
  document.querySelectorAll('#det-status-row .status-opt').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');
  const msg=document.getElementById('det-msg');
  msg.textContent='Salvando...';msg.style.color='var(--kb-muted)';
  try{
    const r=await api({action:'atualizar',unidade:state.unidade,id,campos:JSON.stringify([{campo:'status',valor:novoStatus}]),usuario:state.usuario});
    if(r.sucesso){
      msg.textContent='Status atualizado com sucesso.';msg.style.color='#2d5a2d';
      const c=state.contratos.find(x=>x.id===id);
      if(c)c.status=novoStatus;
    }else{msg.textContent='Erro ao salvar.';msg.style.color='#8b1a1a';}
  }catch(e){msg.textContent='Sem conexão.';msg.style.color='#8b1a1a';}
}

function toggleDisc(el,d){
  el.classList.toggle('selected');
  if(state.discsSel.includes(d)) state.discsSel=state.discsSel.filter(x=>x!==d);
  else state.discsSel.push(d);
}

function selStatus(el,s){
  document.querySelectorAll('.status-select-row .status-opt').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');
  state.statusSel=s;
}

async function salvarContrato(){
  const msg=document.getElementById('novo-msg');
  const dados={
    nome_responsavel:document.getElementById('f-resp').value.trim(),
    nome_aluno:document.getElementById('f-aluno').value.trim(),
    data_contratacao:document.getElementById('f-contrat').value,
    data_solicitacao:document.getElementById('f-solic').value,
    disciplinas:state.discsSel.join(', '),
    valor_multa:document.getElementById('f-multa').value||0,
    status:state.statusSel,
    observacoes:document.getElementById('f-obs').value.trim()
  };
  if(!dados.nome_aluno){msg.textContent='Informe o nome do aluno.';return;}
  if(!dados.data_solicitacao){msg.textContent='Informe a data de solicitação.';return;}
  document.getElementById('btn-salvar').disabled=true;
  msg.textContent='Salvando...';msg.style.color='var(--kb-muted)';
  try{
    const r=await api({action:'criar',unidade:state.unidade,dados:JSON.stringify(dados),usuario:state.usuario});
    if(r.sucesso){
      msg.style.color='#2d5a2d';msg.textContent='Registrado com sucesso!';
      ['f-resp','f-aluno','f-contrat','f-solic','f-multa','f-obs'].forEach(id=>document.getElementById(id).value='');
      document.querySelectorAll('.disc-chip').forEach(e=>e.classList.remove('selected'));
      state.discsSel=[];
      setTimeout(()=>{msg.textContent='';navTo('home');carregarHome();},1500);
    }else{msg.textContent='Erro ao salvar.';msg.style.color='#8b1a1a';}
  }catch(e){msg.textContent='Sem conexão.';msg.style.color='#8b1a1a';}
  document.getElementById('btn-salvar').disabled=false;
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
}

function navTo(name){
  showScreen(name==='home'?'home':name==='novo'?'novo':name==='alertas'?'alertas':'home');
  if(name==='alertas')carregarAlertas();
  if(name==='home')renderHome();
}
</script>
</body>
</html>
